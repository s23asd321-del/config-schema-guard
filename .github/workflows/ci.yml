name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Check good JSON example
        run: python -m config_schema_guard.cli check examples/good-config/config.json --schema examples/schema/basic.schema.json

      - name: Check good TOML example
        run: python -m config_schema_guard.cli check examples/good-config/config.toml --schema examples/schema/basic.schema.json

      - name: Check bad JSON example fails as expected
        run: |
          set +e
          python -m config_schema_guard.cli check examples/bad-config/config.json --schema examples/schema/basic.schema.json --format json > /tmp/config-schema-guard-bad.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 for bad config, got $code"
            exit 1
          fi
          python -m json.tool /tmp/config-schema-guard-bad.json > /dev/null

