[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "config-schema-guard"
version = "0.1.0"
description = "A local-first CLI for lightweight JSON and TOML configuration structure validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "config-schema-guard contributors" }
]
keywords = ["configuration", "schema", "validation", "cli", "toml", "json"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
config-guard = "config_schema_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

